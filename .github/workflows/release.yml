# Release automatica su GitHub.
#
# A ogni push su main questo script guarda la versione scritta in
# aggiornamenti.py (VERSIONE = "1.0.1").
#  - Se su GitHub la release v1.0.1 NON esiste ancora: compila l'app per
#    Mac Apple Silicon, Mac Intel e Windows e crea la release da solo.
#  - Se esiste gia': non fa niente.
#
# Quindi per fare una release basta cambiare il numero di versione
# (lo fa ./rilascia.sh) e fare push.
# Si puo' anche avviare a mano dalla scheda Actions ("Run workflow").

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) C'e' una versione nuova?
  controlla:
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.versione.outputs.versione }}
      nuova: ${{ steps.versione.outputs.nuova }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Leggi la versione e controlla se la release esiste
        id: versione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONE=$(grep '^VERSIONE = ' aggiornamenti.py | cut -d'"' -f2)
          echo "versione=$VERSIONE" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSIONE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$VERSIONE esiste gia': niente da fare."
            echo "nuova=no" >> "$GITHUB_OUTPUT"
          else
            echo "Nuova versione v$VERSIONE: la compilo e creo la release."
            echo "nuova=si" >> "$GITHUB_OUTPUT"
          fi

  # 2) Compilazione sui tre sistemi
  compila:
    needs: controlla
    if: needs.controlla.outputs.nuova == 'si'
    strategy:
      fail-fast: false   # se una compilazione fallisce, le altre continuano
      matrix:
        include:
          - runner: macos-15          # Mac Apple Silicon (M1, M2, M3, M4...)
          - runner: macos-15-intel    # Mac Intel
          - runner: windows-latest    # Windows
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepara e testa (Mac)
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests -v

      - name: Prepara e testa (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt
          .venv\Scripts\python -m unittest discover -s tests -v

      - name: Compila (Mac)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Compila (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call build_windows.bat

      - name: Conserva lo zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.runner }}
          path: dist/*.zip

  # 3) Una sola release con tutti gli zip
  release:
    needs: [controlla, compila]
    if: ${{ !cancelled() && needs.controlla.outputs.nuova == 'si' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prendi gli zip compilati
        uses: actions/download-artifact@v4
        with:
          path: zip
          merge-multiple: true

      - name: Crea la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.controlla.outputs.versione }}
          name: Video Downloader ${{ needs.controlla.outputs.versione }}
          target_commitish: ${{ github.sha }}
          files: zip/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
